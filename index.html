<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="最安値さがし">
<meta name="theme-color" content="#1f6f5c">
<title>最安値さがし</title>
<style>
  :root {
    --bg: #f6f7f5; --card: #fff; --text: #1c2321; --muted: #66706c; --line: #dfe3e0;
    --accent: #1f6f5c; --accent-soft: #e3f1ec; --warn: #9a5b00; --warn-soft: #fdf1dc; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614; --card: #1b201e; --text: #e8ece9; --muted: #9aa5a0; --line: #2d3431;
      --accent: #5cc3a6; --accent-soft: #1d3530; --warn: #f0b35a; --warn-soft: #3a2d17; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 16px; line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  button, .btn { font: inherit; border: 0; border-radius: 12px; cursor: pointer; text-decoration: none; }
  .ghost { background: none; color: var(--muted); padding: 6px 8px; }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .big { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 18px 8px; background: var(--accent); color: #fff; font-weight: 600; font-size: 17px; }
  .big.sub { background: var(--accent-soft); color: var(--accent); }
  .big span { font-size: 28px; line-height: 1; }
  .textrow { display: flex; gap: 8px; margin-top: 10px; }
  input[type=text], input[type=url], input[type=password] { flex: 1; min-width: 0; font: inherit; padding: 12px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); }
  .go { background: var(--accent); color: #fff; padding: 0 18px; font-weight: 600; }
  .status { margin: 14px 0 0; color: var(--muted); min-height: 1.5em; }
  .status.err { color: var(--err); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .recognized { margin-top: 14px; }
  .recognized small { color: var(--muted); display: block; margin-bottom: 6px; }
  .preview { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; float: right; margin-left: 8px; }
  .item { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item img { width: 64px; height: 64px; object-fit: contain; background: #fff; border-radius: 8px; }
  .rank { font-weight: 700; color: var(--accent); margin-right: 4px; }
  .total { font-size: 20px; font-weight: 700; }
  .breakdown { color: var(--muted); font-size: 13px; }
  .name { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-right: 4px;
    background: var(--accent-soft); color: var(--accent); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .buy { display: inline-block; margin-top: 6px; background: var(--accent); color: #fff; padding: 6px 14px; font-size: 14px; }
  .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .links a { display: block; text-align: center; padding: 12px 6px; background: var(--card); border: 1px solid var(--line);
    color: var(--text); font-weight: 600; }
  .note { font-size: 13px; color: var(--muted); }
  .more { width: 100%; margin-top: 8px; padding: 10px; background: var(--accent-soft); color: var(--accent); }
  dialog { border: 0; border-radius: 16px; padding: 20px; width: min(92vw, 420px); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog label { display: block; margin: 12px 0 4px; font-size: 14px; }
  dialog input { width: 100%; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .row button { flex: 1; padding: 12px; }
  .plan { margin-top: 14px; font-size: 14px; }
  .plan button { margin-top: 8px; padding: 8px 12px; background: var(--accent-soft); color: var(--accent); font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>最安値さがし</h1>
    <button class="ghost" id="openSettings">⚙ 設定</button>
  </header>

  <div class="inputs">
    <label class="big btn"><span>📷</span>撮影する
      <input id="camera" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="big sub btn"><span>🖼</span>アルバムから
      <input id="album" type="file" accept="image/*" hidden></label>
  </div>
  <form class="textrow" id="textForm">
    <input type="text" id="query" placeholder="商品名・型番・JANコードを入力" enterkeyhint="search">
    <button class="go">検索</button>
  </form>

  <p class="status" id="status"></p>

  <div class="card recognized hidden" id="recognized">
    <img class="preview hidden" id="preview" alt="">
    <small>写真から読み取った内容（違っていたら直して再検索）</small>
    <div id="recogDetail" class="meta"></div>
  </div>

  <section id="results" class="hidden">
    <div class="card plan hidden" id="planInfo"></div>
    <h2>送料込みで確定（実質価格の安い順）</h2>
    <div class="card" id="fixedList"></div>

    <h2>送料別・要確認（商品価格の安い順）</h2>
    <p class="note">送料はお店のページで兵庫県あてを確認してください。この金額には送料が入っていません。</p>
    <div class="card" id="unknownList"></div>

    <button class="more hidden" id="showCheap"></button>
  </section>

  <section id="linkSection" class="hidden">
    <h2>ほかのお店で見る</h2>
    <div class="links" id="links"></div>
    <p class="note">Amazon・ヨドバシ・価格.comは自動で価格を取り込めないため、検索結果ページを開きます。</p>
  </section>

  <p class="note" style="margin-top:28px">実質価格＝商品価格＋送料−ポイント（基本倍率の目安。キャンペーン分は含みません）。価格は検索した時点のものです。</p>
</main>

<dialog id="settings">
  <h2 style="margin-top:0">設定</h2>
  <label for="endpoint">中継役のURL</label>
  <input type="url" id="endpoint" placeholder="https://xxxx.workers.dev">
  <label for="password">合言葉</label>
  <input type="password" id="password">
  <p class="note">この2つはこのiPhoneの中にだけ保存されます。</p>
  <div class="row">
    <button type="button" class="ghost" id="closeSettings">閉じる</button>
    <button type="button" class="go" id="saveSettings">保存</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const yen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pt = (n, minus) => (n > 0 ? `ポイント ${minus ? "−" : ""}${n.toLocaleString("ja-JP")}` : "ポイントなし");
const safeUrl = (u) => (/^https:\/\//.test(u || "") ? u : "#");

// ---- 設定の保存（このiPhoneの中だけ） ----
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function openSettings() {
  $("endpoint").value = store.get("endpoint");
  $("password").value = store.get("password");
  $("settings").showModal();
}
$("openSettings").onclick = openSettings;
$("closeSettings").onclick = () => $("settings").close();
$("saveSettings").onclick = () => {
  store.set("endpoint", $("endpoint").value.trim().replace(/\/+$/, ""));
  store.set("password", $("password").value);
  $("settings").close();
  setStatus("設定を保存しました。");
};

function setStatus(msg, isErr = false) {
  $("status").textContent = msg;
  $("status").className = "status" + (isErr ? " err" : "");
}

async function callApi(path, options = {}) {
  const endpoint = store.get("endpoint");
  if (!endpoint) { openSettings(); throw new Error("先に設定を入力してください。"); }
  const res = await fetch(endpoint + path, {
    ...options,
    headers: { ...(options.headers || {}), "X-App-Password": store.get("password") },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "通信に失敗しました（" + res.status + "）");
  return data;
}

// ---- 写真を小さくしてから送る ----
function shrink(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => reject(new Error("写真を開けませんでした。"));
    img.src = URL.createObjectURL(file);
  });
}

async function onPhoto(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    setStatus("写真を読み取っています…");
    const dataUrl = await shrink(file);
    $("preview").src = dataUrl;
    $("preview").classList.remove("hidden");
    const r = await callApi("/identify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: dataUrl.split(",")[1], mime: "image/jpeg" }),
    });
    const conf = { high: "高い", medium: "ふつう", low: "低い" }[r.confidence] || "";
    $("recogDetail").innerHTML =
      `<b>${esc(r.product_name)}</b><br>` +
      (r.brand ? `メーカー：${esc(r.brand)}　` : "") +
      (r.model_number ? `型番：${esc(r.model_number)}　` : "") +
      (r.jan_code ? `JAN：${esc(r.jan_code)}　` : "") +
      (conf ? `確からしさ：${conf}` : "");
    $("recognized").classList.remove("hidden");
    $("query").value = r.jan_code || r.search_keyword || r.product_name;
    if (r.confidence === "low") setStatus("読み取りの確からしさが低めです。検索語を確認してください。");
    await runSearch($("query").value);
  } catch (err) {
    setStatus(err.message, true);
  }
}
$("camera").onchange = onPhoto;
$("album").onchange = onPhoto;

$("textForm").onsubmit = (e) => {
  e.preventDefault();
  $("query").blur();
  const q = $("query").value.trim();
  if (q) runSearch(q);
};

// ---- 検索して並べる ----
let cheapHidden = [];
async function runSearch(q, raw = false) {
  const isJan = /^(\d{8}|\d{13})$/.test(q.replace(/\D/g, "")) && /^[\d\s-]+$/.test(q);
  renderLinks(q);
  setStatus(isJan || raw ? "楽天・Yahoo!を検索しています…" : "検索語を整えてから、楽天・Yahoo!を検索しています…");
  try {
    const params = new URLSearchParams(isJan ? { jan: q.replace(/\D/g, "") } : { q });
    if (raw) params.set("raw", "1");
    const data = await callApi("/search?" + params);
    const plan = data.plan;
    if (plan) renderLinks(plan.keyword);
    renderPlan(q, plan, data.notice, raw);
    let items = data.items.filter((it) => it.price > 0);
    items.forEach((it) => { it.total = it.price - it.point; });

    // 型番や文字で探したときは、付属品など極端に安いものを一旦隠す
    cheapHidden = [];
    if (!isJan && !(plan && plan.minPrice > 0) && items.length >= 5) {
      const sorted = items.map((it) => it.price).sort((a, b) => a - b);
      const median = sorted[Math.floor(sorted.length / 2)];
      cheapHidden = items.filter((it) => it.price < median * 0.35);
      items = items.filter((it) => it.price >= median * 0.35);
    }
    render(items);
    const btn = $("showCheap");
    if (cheapHidden.length) {
      btn.textContent = `極端に安い${cheapHidden.length}件（付属品などの可能性）を表示`;
      btn.classList.remove("hidden");
      btn.onclick = () => { render(items.concat(cheapHidden)); btn.classList.add("hidden"); };
    } else btn.classList.add("hidden");

    const msg = items.length ? `${items.length}件見つかりました。` : "見つかりませんでした。検索語を短くして試してください。";
    setStatus(msg + (data.errors.length ? "（一部失敗：" + data.errors.join("／") + "）" : ""), data.errors.length > 0 && !items.length);
  } catch (err) {
    setStatus(err.message, true);
  }
}

// AIがどう検索語を整えたかを見せ、外したいときは絞り込みなしで検索し直せるようにする
function renderPlan(q, plan, notice, raw) {
  const box = $("planInfo");
  let html = "";
  if (plan) {
    html = `検索語：<b>${esc(plan.keyword)}</b>` +
      (plan.minPrice > 0 ? `　／　<b>${yen(plan.minPrice)}以上</b>に絞り込み（関連商品を除くため）` : "");
  }
  if (notice) html += (html ? "<br>" : "") + esc(notice);
  if (raw) html = "絞り込みなしで検索しました。関連商品が混じることがあります。";
  if (!html) { box.classList.add("hidden"); return; }
  if (plan && !raw) html += `<br><button type="button" id="rawSearch">本体が見当たらないときは：絞り込みなしで検索</button>`;
  box.innerHTML = html;
  box.classList.remove("hidden");
  const b = $("rawSearch");
  if (b) b.onclick = () => runSearch(q, true);
}

function itemHtml(it, rank) {
  const fixed = it.shipping === "free";
  return `<div class="item">
    <img src="${esc(safeUrl(it.image))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <div>
      <div>${rank ? `<span class="rank">${rank}位</span>` : ""}<span class="total">${yen(fixed ? it.total : it.price)}</span></div>
      <div class="breakdown">${fixed
        ? `商品 ${yen(it.price)}・送料 ¥0・${pt(it.point, true)}`
        : `商品 ${yen(it.price)}＋送料（要確認）・${pt(it.point)}`}</div>
      <div class="meta"><span class="tag">${esc(it.shop)}</span><span class="tag ${fixed ? "" : "warn"}">${esc(it.shippingLabel)}</span>${esc(it.store)}</div>
      <div class="name">${esc(it.name)}</div>
      <a class="buy btn" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">お店で見る →</a>
    </div>
  </div>`;
}

function render(items) {
  const fixed = items.filter((it) => it.shipping === "free").sort((a, b) => a.total - b.total);
  const unknown = items.filter((it) => it.shipping !== "free").sort((a, b) => a.price - b.price);
  $("fixedList").innerHTML = fixed.slice(0, 20).map((it, i) => itemHtml(it, i + 1)).join("") || '<p class="note">該当なし</p>';
  $("unknownList").innerHTML = unknown.slice(0, 10).map((it) => itemHtml(it)).join("") || '<p class="note">該当なし</p>';
  $("results").classList.remove("hidden");
}

function renderLinks(q) {
  const k = encodeURIComponent(q);
  const links = [
    ["Amazon", `https://www.amazon.co.jp/s?k=${k}`],
    ["ヨドバシ", `https://www.yodobashi.com/?word=${k}`],
    ["価格.com", `https://search.kakaku.com/${k}/`],
    ["楽天市場", `https://search.rakuten.co.jp/search/mall/${k}/`],
    ["Yahoo!ショッピング", `https://shopping.yahoo.co.jp/search?p=${k}`],
  ];
  $("links").innerHTML = links.map(([n, u]) => `<a class="btn" href="${u}" target="_blank" rel="noopener">${n}</a>`).join("");
  $("linkSection").classList.remove("hidden");
}

if (!store.get("endpoint")) setStatus("はじめに右上の「⚙ 設定」から中継役のURLと合言葉を入れてください。");
</script>
</body>
</html>
